services:
  - type: web
    name: voicerag-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: TARGET_LATENCY_MS
        value: "200.0"
      - key: PRIMARY_GENERATION_MODEL
        value: "gemini-3.5-flash-lite"
      - key: FALLBACK_GENERATION_MODELS
        value: "gemini-2.5-flash,gemini-1.5-flash"
